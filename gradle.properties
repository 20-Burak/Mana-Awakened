# Gradle memory and performance settings (same values as MurimBodyTempering).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names - https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# NeoForge version we compile against (already in your Gradle cache from MurimBodyTempering).
neo_version=21.1.256
# Oldest NeoForge build the finished jar accepts at runtime. Every API used exists since the first 1.21.1 build (21.1.0).
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Mod properties
mod_id=mana_awakened
mod_name=Mana Awakened
mod_license=GPL-3.0
mod_version=1.0.0
mod_group_id=com.manaawakened
mod_authors=Burak

# Folders that `gradlew deployToInstances` copies the built jar into (separate with ;).
# Older mana_awakened-*.jar files in these folders are replaced so the game never sees two copies.
deploy_dirs=C:/Users/Burak/curseforge/minecraft/Instances/SakinPack/mods;C:/Users/Burak/curseforge/minecraft/Instances/AS/mods
