modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# Left empty until the mod has a public issue tracker.
#issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Left empty until the mod has a public page.
#displayURL=""
logoFile="mana_awakened.png"
description='''
Manhwa-style magic cultivation: meditate to gather mana, train your core and break through ten Circles, from Mortal to Transcendent Deity.
Inscribe your own spells at the Inscription Altar, from fire bolts and meteor volleys to ore sensing and gates to other worlds, each cast with its own magic circles and gestures.
Iron's Spells 'n Spellbooks, Ars Nouveau and Mahou Tsukai draw on the same mana pool when they are installed.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Player Animator (KosmX): the meditation poses are layered animations, so they mix with Iron's Spells instead of fighting it.
# Any 2.x build for this Minecraft version (the oldest, 2.0.0+1.21.1, and the newest were both tested).
[[dependencies.${mod_id}]]
    modId="playeranimator"
    type="required"
    versionRange="[2.0.0,3.0)"
    ordering="NONE"
    side="BOTH"

# Optional: the magic mods that share the mana pool. Each range starts at the oldest build that passed our tests and is OPEN at the
# top: NeoForge refuses to start when an optional mod is installed at a version outside its range, so a newer build must always be
# accepted (the bridge checks what it needs when it starts and switches itself off, with one warning, if something is missing).
# Tested: Iron's 1.21-3.4.4 .. 1.21.1-3.16.3, Ars Nouveau 5.8.2 .. 5.13.3, Mahou Tsukai 1.21.0-v1.35.12 .. 1.21.1-v1.36.28.
# Curios: the range Iron's Spells itself declares (Mana Awakened does not use Curios; it is listed for the load order).
# Without them the mod runs on its own.
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="optional"
    versionRange="[1.21-3.4.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    type="optional"
    versionRange="[5.8.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mahoutsukai"
    type="optional"
    versionRange="[1.21.0-v1.35.12,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.0.5+1.21.0,)"
    ordering="AFTER"
    side="BOTH"
