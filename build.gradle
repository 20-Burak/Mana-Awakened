plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only resources from the finished jar.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Player Animator (the required animation library) and the magic mods we bridge come from Modrinth's Maven, and only from there.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // CurseForge files that are not on Modrinth (Mahou Tsukai 1.36.28), through CurseMaven: curse.maven:<slug>-<projectId>:<fileId>.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 with Minecraft 1.21.1, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Boots a headless server, runs every Mana Awakened game test, then exits.
        // Usage: .\gradlew.bat runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' = present when testing with runClient/runServer, never published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The magic mods we bridge (Iron's Spells, Ars Nouveau, Mahou Tsukai) and the libraries they need to run. Nothing comes from ./libs.
// Compiled against the builds we test with (compileOnly: never bundled, never a dependency of the published jar). They are loaded at
// runtime ONLY when a build set is chosen with -PmagicSet=<set>; without it every run (runClient, runGameTestServer) is plain: Mana
// Awakened, Minecraft, NeoForge and Player Animator. The sets are the oldest builds that pass our tests, the ones we test with, and
// the newest on Modrinth (see DEVELOPING.md, "Magic mod versions").
def magicCompile = [
        'maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3',
        'maven.modrinth:ars-nouveau:5.13.3',
        'curse.maven:mahou-tsukai-342543:8860405',                  // Mahou Tsukai 1.21.1-v1.36.28 (CurseForge only)
]
def magicSets = [
        oldest: [
                'maven.modrinth:irons-spells-n-spellbooks:1.21-3.4.4',
                'maven.modrinth:caelus:KsfI4QsR',                    // Caelus 7.0.1+1.21.1 for NeoForge; Iron's Spells before 3.10 requires it
                'maven.modrinth:ars-nouveau:5.8.2',
                'maven.modrinth:mahou-tsukai:1.35.12',
                'maven.modrinth:curios:9.2.0+1.21.1',
                'maven.modrinth:geckolib:Grwn5rUB',                  // GeckoLib 4.9.3 for NeoForge (the number alone also names the Fabric and Forge files)
        ],
        ours: [
                'maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3',
                'maven.modrinth:irons-lib:1.21.1-2.2.0',
                'maven.modrinth:ars-nouveau:5.13.3',
                'curse.maven:mahou-tsukai-342543:8860405',
                'maven.modrinth:curios:9.5.1+1.21.1',
                'maven.modrinth:geckolib:Grwn5rUB',                  // GeckoLib 4.9.3 for NeoForge (the number alone also names the Fabric and Forge files)
        ],
        newest: [
                'maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3',
                'maven.modrinth:irons-lib:1.21.1-2.2.0',
                'maven.modrinth:ars-nouveau:5.13.3',
                'maven.modrinth:mahou-tsukai:qAJ0gGH9',              // Mahou Tsukai 1.21.1-v1.36.27 (two NeoForge files share the number)
                'maven.modrinth:curios:9.5.1+1.21.1',
                'maven.modrinth:geckolib:Grwn5rUB',                  // GeckoLib 4.9.3 for NeoForge (the number alone also names the Fabric and Forge files)
        ],
]
def magicSet = findProperty('magicSet')?.toString()
if (magicSet != null && !magicSets.containsKey(magicSet)) {
    throw new GradleException("Unknown magicSet '${magicSet}'; use one of ${magicSets.keySet()}")
}

dependencies {
    magicCompile.each { compileOnly(it) { transitive = false } }
    if (magicSet != null) {
        magicSets[magicSet].each { localRuntime(it) { transitive = false } }
    }

    // REQUIRED: Player Animator 2.0.4+1.21.1 (mod id playeranimator), the version Iron's Spells needs too, so players keep one copy.
    // Compiled against and loaded in every run, never bundled (no jar-in-jar): the player installs it like Iron's does.
    implementation 'maven.modrinth:playeranimator:2.0.4+1.21.1-forge'
}

// Expands ${...} properties inside src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The published jar holds the mod and nothing else (1.0.0). The game tests (com.manaawakened.gametest) and the structures only
// they load stay in the source set, so runGameTestServer and runClient still have them, but never reach a player; development
// files are kept out as well. The GPL-3.0 licence text goes into the jar's root.
tasks.named('jar', Jar).configure {
    exclude 'com/manaawakened/gametest/**'
    exclude 'data/mana_awakened/structure/**'
    exclude 'PROGRESS.md', 'DEVELOPING.md', 'tools/**', 'templates/**', 'release/**', '**/*.py', '**/*.ps1', '**/*.bbmodel'
    from(rootProject.file('LICENSE'))
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copies the built jar into every folder listed in deploy_dirs (gradle.properties).
// Older mana_awakened-<version>.jar files there are removed first, so the game never loads two copies.
// Usage: .\gradlew.bat build deployToInstances -x test --no-daemon
def deployDirList = (findProperty('deploy_dirs') ?: '').toString().split(';').collect { it.trim() }.findAll { !it.isEmpty() }
def deployJarPattern = '^' + java.util.regex.Pattern.quote(mod_id.toString()) + '-\\d[\\w.+-]*\\.jar$'
tasks.register('deployToInstances') {
    group = 'mana awakened'
    description = 'Copies the built mod jar into the CurseForge instances listed in deploy_dirs.'
    dependsOn tasks.named('jar')
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    def targets = deployDirList
    def pattern = deployJarPattern
    doLast { task ->
        File source = builtJar.get().asFile
        targets.each { String path ->
            File dir = new File(path)
            if (!dir.isDirectory()) {
                task.logger.warn("[deploy] Skipped ${path} (folder not found)")
                return
            }
            dir.listFiles()?.findAll { File f -> f.isFile() && f.name ==~ pattern && f.name != source.name }?.each { File old ->
                // Two versions in one mods folder stop the game from starting, so never leave one behind.
                if (!old.delete()) {
                    throw new GradleException("[deploy] Could not remove ${old.absolutePath}. Close Minecraft/CurseForge and run the task again.")
                }
                task.logger.lifecycle("[deploy] Removed old ${old.name} from ${path}")
            }
            java.nio.file.Files.copy(source.toPath(), new File(dir, source.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            task.logger.lifecycle("[deploy] ${source.name} -> ${path}")
        }
    }
}
